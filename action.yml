# The GitHub Action: downloads the release binary for the runner and runs
# it. Composite rather than Docker so it starts in a second and works on
# every runner OS. Usage:
#
#   - uses: avison9/cdclint@v0
#     with:
#       migrations: db/migrations
#       connector: analytics/cdc/postgres-source.json
#       sink: analytics/schema
#
name: cdclint
description: Lint the contract between your database, your Debezium connector and your warehouse before a deploy silently drops a column.
author: avison9
branding:
  icon: check-circle
  color: blue

inputs:
  migrations:
    description: Directory of source migrations, applied in name order.
    required: true
  connector:
    description: Debezium source connector JSON.
    required: true
  sink:
    description: >-
      Sink DDL directory as [dialect:]DIR, one per line for several.
      Dialect is clickhouse (default), bigquery, snowflake or iceberg.
    required: true
  sink-connector:
    description: Kafka Connect sink connector JSON, one per line for several.
    required: false
    default: ""
  fail-on:
    description: "Exit non-zero at this severity or above: error, warning or info."
    required: false
    default: error
  disable:
    description: >-
      Rules to leave out, comma-separated, such as source-column-not-captured.
      Their findings are not shown and do not fail the step; the log says how
      many were left out. An unknown rule name fails the step.
    required: false
    default: ""
  version:
    description: cdclint release to run, as a tag such as v0.1.0; latest by default.
    required: false
    default: latest
  working-directory:
    description: Directory the paths above are relative to.
    required: false
    default: .
  base:
    description: >-
      What the change is judged against, for the schema-before-connector
      rule: a branch name (main, origin/main), a tag, a commit id, or
      "none" to skip the rule. On pull_request events it defaults to the
      pull request's base branch tip. That is the tip, not the merge base:
      a column added to the base after this branch forked reads as removed
      here, never as added, so it cannot produce a finding; and a connector
      edited on the base after the fork reads as changed here, which
      silences the rule for this run.
    required: false
    default: ""

outputs:
  exit-code:
    description: cdclint's exit code, 0 when the three schemas agree.
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Download cdclint
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        repo="avison9/cdclint"
        if [ "$VERSION" = "latest" ]; then
          VERSION="$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$repo/releases/latest" | jq -r .tag_name)"
        fi
        case "$RUNNER_OS" in
          Linux)   os=linux ;;
          macOS)   os=darwin ;;
          Windows) os=windows ;;
          *) echo "unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64)   arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "unsupported runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        # Same name .goreleaser.yaml's archives.name_template produces.
        base="cdclint_${VERSION#v}_${os}_${arch}"
        dir="$RUNNER_TEMP/cdclint"
        mkdir -p "$dir"
        url="https://github.com/$repo/releases/download/$VERSION"
        curl -sSL -o "$dir/checksums.txt" "$url/checksums.txt"
        if [ "$os" = windows ]; then
          archive="$base.zip"
        else
          archive="$base.tar.gz"
        fi
        curl -sSL -o "$dir/$archive" "$url/$archive"
        cd "$dir"
        # The checksum file is what the release workflow signed; verifying
        # against it is what makes "downloaded from GitHub" mean something.
        grep " $archive\$" checksums.txt | sha256sum -c -
        if [ "$os" = windows ]; then
          unzip -qo "$archive"
        else
          tar -xzf "$archive"
        fi
        echo "$dir" >> "$GITHUB_PATH"
        echo "cdclint $VERSION for $os/$arch, checksum verified"

    - name: Run cdclint
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MIGRATIONS: ${{ inputs.migrations }}
        CONNECTOR: ${{ inputs.connector }}
        SINKS: ${{ inputs.sink }}
        SINK_CONNECTORS: ${{ inputs.sink-connector }}
        FAIL_ON: ${{ inputs.fail-on }}
        DISABLE: ${{ inputs.disable }}
        BASE: ${{ inputs.base }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -uo pipefail
        args=(--migrations "$MIGRATIONS" --connector "$CONNECTOR" --fail-on "$FAIL_ON")
        if [ -n "$DISABLE" ]; then
          args+=(--disable "$DISABLE")
        fi
        # The diff rule needs the base commit's objects, and
        # actions/checkout fetches one commit by default. Whatever form the
        # base was given in (main, origin/main, a tag, a commit id), it is
        # fetched from origin into FETCH_HEAD and that is what cdclint is
        # handed, so the same input works with a shallow or a full clone.
        if [ -z "$BASE" ] && [ -n "$PR_BASE_SHA" ]; then
          BASE="$PR_BASE_SHA"
        fi
        if [ -n "$BASE" ] && [ "$BASE" != "none" ]; then
          ref="${BASE#origin/}"
          # --depth=1 only on a clone that is already shallow; on a full
          # clone it would make the repository shallow as a side effect.
          depth=""
          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
            depth="--depth=1"
          fi
          if git fetch --no-tags $depth origin "$ref" >/dev/null 2>&1; then
            args+=(--base FETCH_HEAD)
          elif git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            args+=(--base "$BASE")
          else
            echo "cdclint: could not fetch base $BASE from origin; the schema-before-connector rule is skipped this run" >&2
          fi
        fi
        while IFS= read -r line; do
          [ -n "$line" ] && args+=(--sink "$line")
        done <<< "$SINKS"
        while IFS= read -r line; do
          [ -n "$line" ] && args+=(--sink-connector "$line")
        done <<< "$SINK_CONNECTORS"
        cdclint "${args[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit $code
