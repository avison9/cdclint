<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="cdclint architecture: the source migrations, the Debezium connector, an optional Kafka Connect sink connector, the sink DDL and an optional git base ref are read as files into one model; every sink column is resolved to the source column it expects; three groups of rules judge the result; cdclint:ignore markers record decisions; findings name the line to edit and exit 1 fails the pull request.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="1040" fill="#ffffff"/>

  <!-- inputs -->
  <rect x="40" y="20" width="1120" height="160" rx="8" fill="#f3f4f6" stroke="#374151"/>
  <text x="60" y="46" font-weight="bold" font-size="14" fill="#111827">your repository</text>
  <text x="60" y="64" fill="#374151">three schemas and the connector between them, read as files: no database, no credentials</text>
  <g fill="#ffffff" stroke="#374151">
    <rect x="68" y="80" width="200" height="86" rx="5"/>
    <rect x="284" y="80" width="200" height="86" rx="5"/>
    <rect x="500" y="80" width="200" height="86" rx="5" stroke-dasharray="5 4"/>
    <rect x="716" y="80" width="200" height="86" rx="5"/>
    <rect x="932" y="80" width="200" height="86" rx="5" stroke-dasharray="5 4"/>
  </g>
  <g text-anchor="middle" fill="#111827">
    <text x="168" y="104" font-weight="bold">Source migrations</text>
    <text x="168" y="126">Postgres · MySQL · MariaDB</text>
    <text x="168" y="152" font-family="Menlo, Consolas, monospace" font-size="11" fill="#374151">--migrations</text>

    <text x="384" y="104" font-weight="bold">Debezium connector</text>
    <text x="384" y="126">source connector JSON</text>
    <text x="384" y="152" font-family="Menlo, Consolas, monospace" font-size="11" fill="#374151">--connector</text>

    <text x="600" y="104" font-weight="bold">Sink connector</text>
    <text x="600" y="126">Kafka Connect JSON, optional</text>
    <text x="600" y="152" font-family="Menlo, Consolas, monospace" font-size="11" fill="#374151">--sink-connector</text>

    <text x="816" y="102" font-weight="bold">Sink DDL</text>
    <text x="816" y="122">ClickHouse · BigQuery</text>
    <text x="816" y="138">Snowflake · Iceberg</text>
    <text x="816" y="156" font-family="Menlo, Consolas, monospace" font-size="11" fill="#374151">--sink</text>

    <text x="1032" y="104" font-weight="bold">Git base ref</text>
    <text x="1032" y="126">the pull request's target, optional</text>
    <text x="1032" y="152" font-family="Menlo, Consolas, monospace" font-size="11" fill="#374151">--base</text>
  </g>

  <!-- inputs to readers -->
  <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="168" y1="166" x2="168" y2="254"/>
    <line x1="384" y1="166" x2="384" y2="254"/>
    <line x1="640" y1="166" x2="640" y2="254"/>
    <line x1="816" y1="166" x2="816" y2="254"/>
    <line x1="1032" y1="166" x2="1032" y2="254"/>
    <polyline points="540,166 540,198 450,198 450,254" stroke-dasharray="5 4"/>
  </g>
  <text x="460" y="192" fill="#374151">transforms</text>

  <!-- cdclint -->
  <rect x="40" y="220" width="1120" height="620" rx="8" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="60" y="824" font-weight="bold" font-size="14" fill="#111827">cdclint<tspan font-weight="normal" font-size="12" fill="#374151">  one static binary, Go standard library only</tspan></text>

  <!-- readers -->
  <g fill="#ffffff" stroke="#374151">
    <rect x="68" y="256" width="200" height="86" rx="5"/>
    <rect x="284" y="256" width="200" height="86" rx="5"/>
    <rect x="500" y="256" width="416" height="86" rx="5"/>
    <rect x="932" y="256" width="200" height="86" rx="5"/>
  </g>
  <g text-anchor="middle" fill="#111827">
    <text x="168" y="278" font-weight="bold">Source reader</text>
    <text x="168" y="298">source/postgres · source/mysql</text>
    <text x="168" y="314">replays up migrations in order</text>
    <text x="168" y="330">skips down migrations</text>

    <text x="384" y="278" font-weight="bold">Capture reader</text>
    <text x="384" y="298">capture/debezium · smt</text>
    <text x="384" y="314">include and exclude lists · topics</text>
    <text x="384" y="330">transforms · replica identity</text>

    <text x="708" y="278" font-weight="bold">Sink readers</text>
    <text x="708" y="298">sink/clickhouse · sink/sqlddl · sink/connect</text>
    <text x="708" y="314">Kafka-engine tables · materialized views</text>
    <text x="708" y="330">BigQuery · Snowflake · Iceberg · topic-to-table maps</text>

    <text x="1032" y="278" font-weight="bold">Base reader</text>
    <text x="1032" y="298">gitread</text>
    <text x="1032" y="314">the same files</text>
    <text x="1032" y="330">as they were at --base</text>
  </g>

  <!-- readers to model -->
  <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="168" y1="342" x2="168" y2="390"/>
    <line x1="384" y1="342" x2="384" y2="390"/>
    <line x1="708" y1="342" x2="708" y2="390"/>
  </g>

  <!-- model -->
  <g fill="#f9fafb" stroke="#374151">
    <rect x="68" y="392" width="200" height="64" rx="5"/>
    <rect x="284" y="392" width="200" height="64" rx="5"/>
    <rect x="500" y="392" width="416" height="64" rx="5"/>
  </g>
  <g text-anchor="middle" fill="#111827">
    <text x="168" y="414" font-weight="bold">Source</text>
    <text x="168" y="432">tables · columns · keys</text>
    <text x="168" y="448">replica identity</text>

    <text x="384" y="414" font-weight="bold">Contract</text>
    <text x="384" y="432">what is captured,</text>
    <text x="384" y="448">under which topic</text>

    <text x="708" y="414" font-weight="bold">Sink</text>
    <text x="708" y="432">what each table reads,</text>
    <text x="708" y="448">from which topic</text>
  </g>

  <!-- model to resolve -->
  <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="168" y1="456" x2="168" y2="498"/>
    <line x1="384" y1="456" x2="384" y2="498"/>
    <line x1="708" y1="456" x2="708" y2="498"/>
  </g>

  <!-- resolve: the accent -->
  <rect x="68" y="500" width="848" height="60" rx="5" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="492" y="524" font-weight="bold" fill="#c2410c">Resolve</text>
    <text x="492" y="544" fill="#111827">every sink column to the source column it expects: by topic, by sink connector map, or by table name</text>
  </g>

  <!-- resolve to rules -->
  <g stroke="#c2410c" stroke-width="1.5" fill="none" marker-end="url(#acc)">
    <line x1="278" y1="560" x2="278" y2="602"/>
    <line x1="710" y1="560" x2="710" y2="602"/>
    <polyline points="916,530 990,530 990,602"/>
  </g>
  <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="1074" y1="342" x2="1074" y2="602"/>
  </g>
  <text x="1082" y="470" fill="#374151">the diff</text>

  <!-- rules -->
  <g fill="#ffffff" stroke="#374151">
    <rect x="68" y="604" width="420" height="108" rx="5"/>
    <rect x="504" y="604" width="412" height="108" rx="5"/>
    <rect x="932" y="604" width="200" height="108" rx="5"/>
  </g>
  <g text-anchor="middle" fill="#111827">
    <text x="278" y="626" font-weight="bold">Does the stream carry what the sink reads?</text>
    <g font-family="Menlo, Consolas, monospace" font-size="11" fill="#374151">
      <text x="278" y="650">sink-column-not-captured · sink-table-not-captured</text>
      <text x="278" y="668">sink-column-unknown · topic-table-mapping</text>
      <text x="278" y="686">sink-column-flattened · mv-column-match</text>
    </g>

    <text x="710" y="626" font-weight="bold">Is the connector right about the source?</text>
    <g font-family="Menlo, Consolas, monospace" font-size="11" fill="#374151">
      <text x="710" y="650">captured-column-missing · captured-table-missing</text>
      <text x="710" y="668">replica-identity</text>
      <text x="710" y="686">source-column-not-captured (info)</text>
    </g>

    <text x="1032" y="626" font-weight="bold">Did this change</text>
    <text x="1032" y="642" font-weight="bold">forget the connector?</text>
    <text x="1032" y="668" font-family="Menlo, Consolas, monospace" font-size="11" fill="#374151">schema-before-connector</text>
    <text x="1032" y="686" fill="#374151">judged per column, on the diff</text>
  </g>

  <!-- rules to decisions -->
  <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="278" y1="712" x2="278" y2="750"/>
    <line x1="710" y1="712" x2="710" y2="750"/>
    <line x1="1032" y1="712" x2="1032" y2="750"/>
  </g>

  <!-- decisions -->
  <rect x="68" y="752" width="1064" height="50" rx="5" fill="#ffffff" stroke="#374151" stroke-dasharray="5 4"/>
  <text x="88" y="773" font-weight="bold" fill="#111827">Decisions recorded in the SQL</text>
  <text x="88" y="791" fill="#374151"><tspan font-family="Menlo, Consolas, monospace" font-size="11">-- cdclint:ignore &lt;rule&gt;: &lt;reason&gt;</tspan> on the line a finding points at: listed as acknowledged, with its reason, and it does not fail the run</text>

  <!-- cdclint to output -->
  <line x1="600" y1="802" x2="600" y2="876" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="610" y="862" fill="#374151">findings, sorted · --disable leaves a rule out, and says so</text>

  <!-- output -->
  <rect x="40" y="878" width="1120" height="148" rx="8" fill="#f3f4f6" stroke="#374151"/>
  <text x="60" y="904" font-weight="bold" font-size="14" fill="#111827">output</text>
  <text x="60" y="922" fill="#374151">each finding names the line to edit, the problem, what happens if it ships, and a fix to paste</text>

  <rect x="68" y="936" width="740" height="76" rx="5" fill="#ffffff" stroke="#374151"/>
  <g font-family="Menlo, Consolas, monospace" font-size="11" fill="#111827">
    <text x="84" y="956"><tspan font-weight="bold" fill="#c2410c">error</tspan> sink-column-not-captured corpus/include-list-typo/sink/0020_report_validations.sql:12</text>
    <text x="100" y="972" fill="#374151">public.report_validations.responded_at is read by kafka_report_validations ...</text>
    <text x="100" y="988" fill="#374151">every row will carry the column's default, with no error anywhere</text>
    <text x="100" y="1004" fill="#374151">fix: add public.report_validations.responded_at to column.include.list, ...</text>
  </g>

  <rect x="824" y="936" width="308" height="76" rx="5" fill="#ffffff" stroke="#374151"/>
  <g text-anchor="middle" fill="#111827">
    <text x="978" y="958">text or JSON · <tspan font-family="Menlo, Consolas, monospace" font-size="11">--fail-on</tspan> error | warning | info</text>
    <text x="978" y="978" font-weight="bold" fill="#c2410c">exit 1 fails the pull request</text>
    <text x="978" y="998">GitHub Action · Jenkins · any shell</text>
  </g>
</svg>
